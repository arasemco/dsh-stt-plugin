name: Release

# Push a tag like v0.1.0: both suites run against fake providers, the npm
# tarball is built and attached to the GitHub Release, and the release notes are
# generated from the commits since the previous tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The package has no runtime dependencies; the suites need this harness.
      - name: Install test harness
        run: npm install --no-save --no-package-lock react@18 react-dom@18 jsdom
      - name: Test
        run: node --test test/client.test.mjs test/host.test.mjs
        env:
          NODE_ENV: development
      - name: Build tarball
        run: npm pack
      - name: Record tarball SHA-256
        run: |
          echo '### Tarball SHA-256' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: '*.tgz'
